# docker-compose.yml — uruchamia cały stack Telemetrus
#
# Użycie:
#   docker compose up -d --build              -> cały stack: RabbitMQ, InfluxDB i wszystkie 3 aplikacje .NET
#   docker compose up -d rabbitmq influxdb     -> tylko infrastruktura; aplikacje .NET uruchamiasz wtedy
#                                                  lokalnie przez `dotnet run` (wygodniejszy debug/hot-reload)
#
# Uruchamia:
#   - RabbitMQ (broker kolejek) z panelem management na http://localhost:15672 (guest/guest)
#   - InfluxDB (baza czasowa) na http://localhost:8086 (login: admin, hasło: admin12345)
#   - FrontApi (REST API) na http://localhost:5000
#   - TelemetryWorker (worker w tle — brak wystawionego portu, konsumuje RabbitMQ, pisze do InfluxDB)
#   - NotificationWebApp (webhook + SignalR + UI alertów) na http://localhost:5002
#
# Wymaga pliku .env z INFLUXDB_ADMIN_TOKEN — patrz .env.example.

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: telemetrus-rabbitmq
    ports:
      - "5672:5672"     # port AMQP (dla aplikacji)
      - "15672:15672"   # port panelu webowego (dla człowieka)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    container_name: telemetrus-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: myorg
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      # Token admina jest czytany z pliku .env (skopiuj .env.example -> .env i wygeneruj własną wartość).
      # Ta sama wartość jest automatycznie przekazywana do telemetryworker (InfluxDB__Token) poniżej.
      # Ręczne wklejanie do TelemetryWorker/appsettings.Development.json potrzebne jest tylko w trybie
      # hybrydowym (gdy TelemetryWorker uruchamiasz lokalnie przez `dotnet run`, nie w Dockerze).
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontapi:
    build:
      context: ./FrontApi
    container_name: telemetrus-frontapi
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  telemetryworker:
    build:
      context: ./TelemetryWorker
    container_name: telemetrus-telemetryworker
    environment:
      # Generic host (Host.CreateApplicationBuilder), NIE ASPNETCORE_ENVIRONMENT — ta zmienna nie
      # zadziałałaby tutaj, bo TelemetryWorker nie ma WebApplicationBuilder/Kestrela.
      DOTNET_ENVIRONMENT: Development
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      InfluxDB__Url: http://influxdb:8086
      InfluxDB__Token: ${INFLUXDB_ADMIN_TOKEN}
      InfluxDB__Org: myorg
      InfluxDB__Bucket: telemetry
    depends_on:
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  notificationwebapp:
    build:
      context: ./NotificationWebApp
    container_name: telemetrus-notificationwebapp
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    restart: unless-stopped

volumes:
  rabbitmq_data:
  influxdb_data:
  influxdb_config:
