# docker-compose.yml — uruchamia cały stack Telemetrus
#
# Użycie:
#   docker compose up -d --build              -> cały stack: RabbitMQ, InfluxDB i wszystkie 3 aplikacje .NET
#   docker compose up -d rabbitmq influxdb     -> tylko infrastruktura; aplikacje .NET uruchamiasz wtedy
#                                                  lokalnie przez `dotnet run` (wygodniejszy debug/hot-reload)
#
# Uruchamia:
#   - RabbitMQ (broker kolejek) z panelem management na http://localhost:15672 (guest/guest)
#   - InfluxDB (baza czasowa) na http://localhost:8086 (login: admin, hasło: admin12345)
#   - FrontApi (REST API) na http://localhost:5000
#   - TelemetryWorker (worker w tle — brak wystawionego portu, konsumuje RabbitMQ, pisze do InfluxDB)
#   - NotificationWebApp (webhook + SignalR + UI alertów) na http://localhost:5002
#
# Działa "out of the box" bez żadnej konfiguracji: jeśli nie ma pliku .env,
# INFLUXDB_ADMIN_TOKEN spada do wbudowanej wartości domyślnej (patrz niżej) — nie jest
# to bezpieczny sekret, tylko wartość zaszyta w tym pliku. Chcesz własny token (np. żeby
# wykorzystać tę instancję poza tym stackiem)? Skopiuj .env.example -> .env i wpisz tam
# swoją wartość — .env nadpisze domyślną.

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: telemetrus-rabbitmq
    ports:
      - "5672:5672"     # port AMQP (dla aplikacji)
      - "15672:15672"   # port panelu webowego (dla człowieka)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Pierwsze uruchomienie na świeżym wolumenie czasem pada na starcie (np. wyścig przy
    # zapisie .erlang.cookie na Docker Desktop/Windows) — restart policy podnosi kontener
    # ponownie automatycznie, zamiast zostawiać cały stack zablokowany na depends_on.
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: telemetrus-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: myorg
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      # Token admina: bierze wartość z .env, jeśli plik istnieje, inaczej używa domyślnej wartości
      # demo poniżej — dzięki temu `docker compose up` działa od razu po sklonowaniu repo, bez
      # żadnej ręcznej konfiguracji. Ta sama wartość jest automatycznie przekazywana do
      # telemetryworker (InfluxDB__Token) i alertsetup poniżej. Ręczne wklejanie do
      # TelemetryWorker/appsettings.Development.json potrzebne jest tylko w trybie hybrydowym
      # (gdy TelemetryWorker uruchamiasz lokalnie przez `dotnet run`, nie w Dockerze).
      #
      # UWAGA przy zmianie tokena PO pierwszym starcie: InfluxDB ustawia token administratora tylko
      # RAZ, przy pierwszej inicjalizacji wolumenu influxdb_data. Sama zmiana .env i restart NIE
      # zaktualizuje tokena w już zainicjowanym InfluxDB — worker dostanie 401 Unauthorized i będzie
      # cicho wysyłał wszystko do DLQ. Żeby wymusić ponowną inicjalizację z nowym tokenem, trzeba
      # skasować wolumen: `docker compose down -v` (usuwa też dane z InfluxDB i RabbitMQ).
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:-telemetrus-demo-influxdb-admin-token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontapi:
    build:
      context: ./FrontApi
    container_name: telemetrus-frontapi
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  telemetryworker:
    build:
      context: ./TelemetryWorker
    container_name: telemetrus-telemetryworker
    environment:
      # Generic host (Host.CreateApplicationBuilder), NIE ASPNETCORE_ENVIRONMENT — ta zmienna nie
      # zadziałałaby tutaj, bo TelemetryWorker nie ma WebApplicationBuilder/Kestrela.
      DOTNET_ENVIRONMENT: Development
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      InfluxDB__Url: http://influxdb:8086
      InfluxDB__Token: ${INFLUXDB_ADMIN_TOKEN:-telemetrus-demo-influxdb-admin-token}
      InfluxDB__Org: myorg
      InfluxDB__Bucket: telemetry
    depends_on:
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  notificationwebapp:
    build:
      context: ./NotificationWebApp
    container_name: telemetrus-notificationwebapp
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Adres FrontApi wewnątrz sieci Docker — używany przez przycisk "Wyślij testowy pomiar" w UI
      # (DemoController proxy'uje żądanie do FrontApi). W trybie hybrydowym appsettings.json ma
      # domyślnie http://localhost:5000, tu nadpisujemy na nazwę serwisu + wewnętrzny port 8080.
      FrontApi__Url: http://frontapi:8080
    restart: unless-stopped

  # Jednorazowy provisioner: tworzy w InfluxDB Notification Endpoint + Threshold Check +
  # Notification Rule, zeby alerty (Check -> webhook -> NotificationWebApp -> SignalR -> UI)
  # dzialaly od razu po `docker compose up`, bez recznej konfiguracji w UI InfluxDB opisanej
  # w docs/influxdb-alert-setup.md. Konczy dzialanie po wykonaniu (exit 0) — to normalne, nie
  # dlugo dzialaca usluga. Idempotentny: bezpieczny przy kazdym `docker compose up`.
  alertsetup:
    build:
      context: ./AlertSetup
    container_name: telemetrus-alertsetup
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:-telemetrus-demo-influxdb-admin-token}
      INFLUXDB_ORG: myorg
      INFLUXDB_BUCKET: telemetry
      NOTIFICATION_WEBHOOK_URL: http://notificationwebapp:8080/webhook/influx
    depends_on:
      influxdb:
        condition: service_healthy
    restart: "no"

volumes:
  rabbitmq_data:
  influxdb_data:
  influxdb_config:
